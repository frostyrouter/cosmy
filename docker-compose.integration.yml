services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cosmy
      POSTGRES_PASSWORD: cosmy
      POSTGRES_DB: cosmy
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmy -d cosmy"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  router:
    build: .
    ports:
      - "18080:8080"
    environment:
      ROUTER_ENV: test
      HOST: 0.0.0.0
      PORT: 8080
      REQUEST_TIMEOUT_MS: 10000
      PROVIDER_MAX_RETRIES: 0
      PERSISTENCE_MODE: postgres
      DATABASE_URL: postgresql://cosmy:cosmy@postgres:5432/cosmy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
