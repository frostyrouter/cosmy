services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cosmy
      POSTGRES_PASSWORD: cosmy
      POSTGRES_DB: cosmy
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmy -d cosmy"]
      interval: 3s
      timeout: 3s
      retries: 20

  router:
    build: .
    ports:
      - "18080:8080"
    environment:
      ROUTER_ENV: test
      HOST: 0.0.0.0
      PORT: 8080
      REQUEST_TIMEOUT_MS: 10000
      PROVIDER_MAX_RETRIES: 0
      COSMY_API_CREDENTIALS: '[{"id":"integration-response","tenantId":"integration","keySha256":"c92762865f28145e7a55bf1fa0a6beb1eb1d4adea64ad40b11b710cb47bce4e8","scopes":["responses:create"]},{"id":"integration-metrics","tenantId":"operations","keySha256":"f42d985bfc04c43055baa789dc036d2517d63e15458c6f618f30d6b1c9dc1932","scopes":["metrics:read"]}]'
      PERSISTENCE_MODE: postgres
      DATABASE_URL: postgresql://cosmy:cosmy@postgres:5432/cosmy
    depends_on:
      postgres:
        condition: service_healthy
