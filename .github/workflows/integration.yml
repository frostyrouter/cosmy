name: Integration smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: npm ci
      - run: docker compose -f docker-compose.integration.yml up -d --build
      - run: node scripts/integration-smoke.mjs
      - run: npx vitest run test/*.integration.test.ts --testTimeout=15000
        env:
          DATABASE_URL: postgresql://cosmy:cosmy@localhost:55432/cosmy
      - if: always()
        run: docker compose -f docker-compose.integration.yml logs --no-color
      - if: always()
        run: docker compose -f docker-compose.integration.yml down -v
