name: Integration smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: docker/setup-buildx-action@v3
      - run: npm ci
      - run: docker compose -f docker-compose.integration.yml up -d --build
      - run: node scripts/integration-smoke.mjs
      - run: npx vitest run test/postgres-budget.integration.test.ts --testTimeout=15000
        env:
          DATABASE_URL: postgresql://cosmy:cosmy@localhost:55432/cosmy
      - if: always()
        run: docker compose -f docker-compose.integration.yml logs --no-color
      - if: always()
        run: docker compose -f docker-compose.integration.yml down -v
