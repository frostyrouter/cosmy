name: Integration smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@v3
      - run: python -m pip install httpx
      - run: docker compose -f docker-compose.integration.yml up -d --build
      - run: python scripts/integration_smoke.py
      - if: always()
        run: docker compose -f docker-compose.integration.yml logs --no-color
      - if: always()
        run: docker compose -f docker-compose.integration.yml down -v
